aid: mux
name: Mux
description: 'Mux is an API-first video platform that provides developer tools for
  video streaming, on-demand video, live streaming, real-time video, and video analytics,
  used to ingest, transcode, store, deliver, and measure video inside applications
  without managing video infrastructure. The Mux platform is delivered through two
  product families: Mux Video (ingest, asset management, live streams, playback IDs,
  signed URLs, and Mux Player) and Mux Data (QoE analytics for any HTML5 video player).
  All Mux REST APIs are served from https://api.mux.com, authenticated via HTTP Basic
  auth using a Mux Access Token ID and Secret, and fully described by an OpenAPI specification.'
